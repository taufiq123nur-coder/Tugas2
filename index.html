<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTA - Login</title>
    <link rel="icon" type="image/png" href="img/logo-ut.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 1. MEMUAT VUE.JS (FRAMEWORK UTAMA) -->
    <!-- Framework ini diletakkan di bagian atas (head) agar siap digunakan saat halaman dirender -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-light), var(--primary-color));
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-area h1 {
            color: var(--primary-color);
            font-size: 32px;
            margin-bottom: 5px;
        }

        .logo-area p {
            color: var(--text-light);
            font-size: 14px;
        }

        .form-group {
            text-align: left;
            position: relative;
        }

        .form-group i {
            position: absolute;
            top: 40px;
            left: 15px;
            color: var(--text-light);
        }

        .form-group input {
            padding-left: 40px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-top: 15px;
        }

        .login-links {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .login-links a {
            color: var(--primary-color);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        .login-links a:hover {
            color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Komponen Toast: Menampilkan notifikasi pop-up (Sukses/Gagal) menggunakan data binding Vue -->
        <div class="toast" :class="{ show: toast.show, success: toast.isSuccess }">
            <i class="fas" :class="toast.isSuccess ? 'fa-check-circle' : 'fa-exclamation-circle'"></i>
            <span>{{ toast.message }}</span>
        </div>

        <!-- Container Login Utama -->
        <div class="login-container">
            <div class="logo-area">
                <!-- Logo UT dan Judul Sistem -->
                <img src="img/logo-ut.png" alt="Logo UT" style="width: 80px; margin-bottom: 15px;">
                <h1>SITTA</h1>
                <p>Sistem Informasi Tiras dan Transaksi Bahan Ajar</p>
            </div>
            
            <!-- Form Login dengan Event Listener @submit.prevent untuk menangani login tanpa reload halaman -->
            <form @submit.prevent="handleLogin">
                <div class="form-group">
                    <label>Email</label>
                    <i class="fas fa-envelope"></i>
                    <!-- v-model: Menghubungkan input langsung ke variabel login.email di dataBahanAjar.js -->
                    <input type="email" v-model="login.email" placeholder="Masukkan email anda">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <i class="fas fa-lock"></i>
                    <input type="password" v-model="login.password" placeholder="Masukkan password anda">
                </div>
                <!-- Tombol login yang memicu method handleLogin di instance Vue -->
                <button type="submit" class="btn btn-primary btn-login">Login <i class="fas fa-sign-in-alt"></i></button>
            </form>

            <!-- Tautan bantuan Lupa Password & Daftar -->
            <div class="login-links">
                <a @click="openModal('forgot')">Lupa Password?</a>
                <a @click="openModal('register')">Daftar Akun Baru</a>
            </div>
        </div>

        <!-- Modal Lupa Password (v-class dinamis untuk menampilkan/menyembunyikan) -->
        <div class="stok-modal" :class="{ show: modal === 'forgot' }">
            <div class="stok-content">
                <span class="close" @click="modal = null">&times;</span>
                <h3 style="margin-bottom: 20px; color: var(--primary-color);">Lupa Password</h3>
                <p style="font-size: 14px; margin-bottom: 15px; color: var(--text-light);">Masukkan email yang terdaftar untuk menerima tautan reset password.</p>
                <div class="form-group">
                    <input type="email" v-model="forgotEmail" placeholder="Email Anda">
                </div>
                <button class="btn btn-secondary" style="width: 100%;" @click="submitForgot">Kirim Link Reset</button>
            </div>
        </div>

        <!-- Modal Pendaftaran Akun Baru (Register) -->
        <div class="stok-modal" :class="{ show: modal === 'register' }">
            <div class="stok-content">
                <span class="close" @click="modal = null">&times;</span>
                <h3 style="margin-bottom: 20px; color: var(--primary-color);">Daftar Akun</h3>
                <div class="form-group">
                    <input type="text" v-model="register.name" placeholder="Nama Lengkap">
                </div>
                <div class="form-group">
                    <input type="email" v-model="register.email" placeholder="Email UT (@ut.ac.id)">
                </div>
                <div class="form-group">
                    <input type="password" v-model="register.password" placeholder="Password">
                </div>
                <button class="btn btn-primary" style="width: 100%;" @click="submitRegister">Daftar</button>
            </div>
        </div>
    </div>

    <!-- 2. MEMUAT LOGIKA DAN DATA (VUE INSTANCE) -->
    <!-- Script ini menghubungkan data dummy dan logika login ke elemen HTML di atas -->
    <script src="js/data.js"></script>
    <script src="js/dataBahanAjar.js"></script>
    <script>
        // Catatan: dataBahanAjar.js sudah membuat instance global 'app' yang terhubung ke #app.
        // Logika login, pendaftaran, dan lupa password sudah ditangani secara terpusat di sana.
    </script>
</body>
</html>
